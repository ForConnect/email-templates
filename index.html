<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Templates — ForConnect</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0e14;
    --surface: #111620;
    --surface2: #181e2a;
    --border: #1e2535;
    --border2: #2a3347;
    --text: #e8edf5;
    --muted: #5a6580;
    --muted2: #8a96b0;
    --cyan: #00e5c8;
    --cyan-dim: rgba(0,229,200,0.12);
    --cyan-border: rgba(0,229,200,0.3);
    --sans: 'Inter', sans-serif;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 2.5rem 1rem;
  }

  .container { max-width: 660px; margin: 0 auto; }

  header {
    margin-bottom: 2.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
    flex-shrink: 0;
  }

  header h1 {
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--muted2);
  }
  header h1 span { color: var(--cyan); }

  .field { margin-bottom: 1.5rem; }
  .field label {
    display: block; font-size: 10px; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .field input {
    width: 100%; padding: 11px 16px;
    font-family: var(--sans); font-size: 14px;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--text); outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus { border-color: var(--cyan-border); box-shadow: 0 0 0 3px rgba(0,229,200,0.06); }
  .field input::placeholder { color: var(--muted); }

  .tabs {
    display: flex; gap: 0; margin-bottom: 1.5rem;
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 10px; padding: 4px; flex-wrap: wrap;
  }
  .tab {
    flex: 1; padding: 9px 6px;
    font-family: var(--sans); font-size: 11px; font-weight: 500;
    text-align: center; border: none; background: transparent;
    color: var(--muted2); border-radius: 7px; cursor: pointer;
    transition: all 0.15s; white-space: nowrap;
  }
  .tab.active { background: var(--cyan-dim); color: var(--cyan); border: 1px solid var(--cyan-border); }
  .tab:hover:not(.active) { color: var(--text); background: var(--surface2); }

  .subject-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 10px; background: var(--surface);
    border: 1px solid var(--border2); border-radius: 8px; padding: 8px 12px;
  }
  .subject-label {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--muted); flex-shrink: 0;
  }
  .subject-text {
    font-size: 13px; color: var(--muted2); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .copy-subj {
    font-family: var(--sans); font-size: 11px; font-weight: 600;
    letter-spacing: 0.05em; padding: 5px 12px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--muted2); border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
  }
  .copy-subj:hover { border-color: var(--cyan-border); color: var(--cyan); }
  .copy-subj.done { border-color: var(--cyan-border); color: var(--cyan); background: var(--cyan-dim); }

  .preview {
    background: var(--surface); border: 1px solid var(--border2);
    border-radius: 10px; padding: 1.5rem;
    font-size: 13.5px; line-height: 1.85;
    color: var(--muted2); white-space: pre-wrap;
    font-family: var(--sans); min-height: 260px; margin-bottom: 1rem;
  }
  .preview img {
    display: block; max-width: 420px; margin: 1rem 0;
    border-radius: 8px; border: 1px solid var(--border2);
  }

  .copy-body {
    width: 100%; padding: 13px; font-family: var(--sans);
    font-size: 13px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; background: var(--cyan);
    color: #050a0e; border: none; border-radius: 8px;
    cursor: pointer; transition: all 0.15s;
  }
  .copy-body:hover { background: #00ccb4; }
  .copy-body:active { transform: scale(0.99); }
  .copy-body.done { background: #00b89f; }

  footer {
    margin-top: 2rem; text-align: center;
    font-size: 11px; color: var(--muted); letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo-dot"></div>
    <h1>AI Telefoonassistent &nbsp;·&nbsp; <span>Email Templates</span></h1>
  </header>

  <div class="field">
    <label>Naam / Praktijk</label>
    <input type="text" id="nameInput" placeholder="bijv. Jan de Vries" oninput="render()" />
  </div>

  <div class="tabs">
    <button class="tab active" onclick="setTab(0)">Fysio</button>
    <button class="tab" onclick="setTab(1)">Follow-up NEW</button>
    <button class="tab" onclick="setTab(2)">Follow-up Voicemail</button>
    <button class="tab" onclick="setTab(3)">Demo uitnodiging</button>
  </div>

  <div class="subject-row">
    <span class="subject-label">Subject</span>
    <span class="subject-text" id="subjText"></span>
    <button class="copy-subj" id="copySubj" onclick="copySubj()">Kopieer</button>
  </div>

  <div class="preview" id="preview"></div>

  <button class="copy-body" id="copyBody" onclick="copyBody()">Kopieer volledige e-mail</button>

  <footer>forconnect.nl &nbsp;·&nbsp; AI Telefoonassistent</footer>
</div>

<script>
const SCREENSHOT = 'https://email-templates-sandy-nu.vercel.app/screenshot.jpg';
const IMG_MARKER = '\n[IMG]\n';

const templates = [
  {
    subject: "Snel vraagje over uw telefoon",
    img: true,
    body: n => `Beste ${n},

Als u midden in een behandeling zit en de telefoon gaat — wie neemt dan op?
De meeste praktijken zeggen: "We hebben voicemail." Maar een patiënt met pijn belt niet om een bericht in te spreken. Die hangt op en belt ergens anders.

En als iemand een afspraak van vandaag wil afzeggen? Dan staat die plek leeg — terwijl iemand anders misschien net op een gaatje wacht.

Onze assistent is speciaal ontwikkeld voor fysiopraktijken. Hij neemt op, voert het gesprek en stuurt u direct een overzichtelijke e-mail: naam, reden, telefoonnummer. Geen voicemails meer om aan het einde van de dag door te luisteren.

Meerdere praktijken gebruiken het al — referenties beschikbaar op aanvraag.

De kosten? Ongeveer één behandeling per maand. Twee weken gratis proberen, zonder verdere verplichtingen. Bevalt het? Dan is het maandelijks opzegbaar.

Zelf even horen hoe het klinkt? DEMO lijn: 026 79 132 73`
  },
  {
    subject: "Re: Snel vraagje over uw telefoon",
    body: n => `Beste ${n},

Ik stuurde u een paar dagen geleden een berichtje — misschien kwam het er niet van.

Ik wilde u dit even laten zien. Dit is wat u ontvangt zodra een patiënt belt en u niet kunt opnemen:
[IMG]
De assistent beantwoordt ook praktische vragen — openingstijden, tarieven, locatie, parkeren, verzekeringen. Zonder dat u daar iets voor hoeft te doen.

Twee weken gratis proberen, zonder verdere verplichtingen. Bevalt het? Dan is het maandelijks opzegbaar.

Zelf even horen hoe het klinkt? 026 79 132 73`
  },
  {
    subject: "Ik probeerde u telefonisch te bereiken",
    body: n => `Beste ${n},

Toen wij uw praktijk belden, kwamen we direct op de voicemail.

Dat roept een vraag op: hoeveel van uw bellers laten daadwerkelijk een bericht achter?

In de praktijk hangen de meesten op — zonder dat u weet wie het was of waarom ze belden. Dat kan een bestaande patiënt zijn met een vraag, maar ook iemand die voor het eerst belde en nu ergens anders een afspraak maakt.

En als iemand wél een bericht inspreekt? Dan kost het u daarna tijd om te luisteren, terug te spoelen en de details op te schrijven — tussen behandelingen door.

Onze telefonische assistent overneemt precies op dat moment. Zij beantwoordt vragen en noteert naam, nummer en reden van contact — en stuurt u alles overzichtelijk via e-mail. Geen gemiste oproepen, geen handmatig uitluisteren.

Wilt u de agent zelf even testen?`
  },
  {
    subject: "Probeer het zelf: bel onze AI-assistent (gratis demo)",
    body: n => `Beste ${n},

Benieuwd hoe een AI-telefonist klinkt in de praktijk? U kunt het nu zelf ervaren — geen installatie, geen verplichtingen.

Wij hebben een nep-praktijk (Fysio DEMO) ingericht met echte informatie, zodat u precies kunt horen hoe de assistent uw patiënten te woord staat.

Wat kunt u vragen tijdens de demo?
Bel gerust met een van de volgende vragen:

· Een afspraak maken, wijzigen of annuleren
· Openingstijden of parkeermogelijkheden
· Tarieven en vergoedingen
· Welke klachten of specialisaties de praktijk behandelt

De assistent noteert de gegevens van de beller en stuurt automatisch een e-mail naar de praktijk — precies zoals het bij ú zou werken.

Bel: +31 26 79 132 73

Heeft u vragen na de demo? Ik vertel u graag meer.`
  }
];

let current = 0;

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function setTab(i) {
  current = i;
  document.querySelectorAll('.tab').forEach((t, j) => t.classList.toggle('active', i === j));
  render();
}

function getName() {
  const v = document.getElementById('nameInput').value.trim();
  return v || '[Naam]';
}

function render() {
  const t = templates[current];
  document.getElementById('subjText').textContent = t.subject;
  const preview = document.getElementById('preview');
  const bodyText = t.body(getName());

  if (t.img && bodyText.includes('[IMG]')) {
    const parts = bodyText.split('\n[IMG]\n');
    preview.innerHTML =
      '<span>' + escapeHtml(parts[0]) + '</span>' +
      '<img src="' + SCREENSHOT + '" alt="Voorbeeld e-mail samenvatting">' +
      (parts[1] ? '<span>' + escapeHtml(parts[1]) + '</span>' : '');
  } else {
    preview.textContent = bodyText;
  }

  const cb = document.getElementById('copyBody');
  cb.textContent = 'Kopieer volledige e-mail';
  cb.classList.remove('done');
  const cs = document.getElementById('copySubj');
  cs.textContent = 'Kopieer';
  cs.classList.remove('done');
}

function copyBody() {
  const t = templates[current];
  const rawText = t.body(getName());
  const btn = document.getElementById('copyBody');

  function markDone() {
    btn.textContent = 'Gekopieerd ✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Kopieer volledige e-mail'; btn.classList.remove('done'); }, 2000);
  }

  if (t.img && rawText.includes('[IMG]')) {
    // Build HTML version with inline image
    const parts = rawText.split('\n[IMG]\n');
    const htmlBody =
      '<div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.8;white-space:pre-wrap;">' +
      escapeHtml(parts[0]) +
      '</div>' +
      '<img src="' + SCREENSHOT + '" style="max-width:420px;margin:12px 0;border-radius:6px;" alt="Voorbeeld e-mail">' +
      '<div style="font-family:Arial,sans-serif;font-size:14px;line-height:1.8;white-space:pre-wrap;">' +
      (parts[1] ? escapeHtml(parts[1]) : '') +
      '</div>';

    const plainText = rawText.split('\n[IMG]\n').join('\n');

    try {
      const htmlBlob = new Blob([htmlBody], { type: 'text/html' });
      const textBlob = new Blob([plainText], { type: 'text/plain' });
      navigator.clipboard.write([new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob })]).then(markDone);
    } catch(e) {
      navigator.clipboard.writeText(plainText).then(markDone);
    }
  } else {
    navigator.clipboard.writeText(rawText).then(markDone);
  }
}

function copySubj() {
  navigator.clipboard.writeText(templates[current].subject).then(() => {
    const btn = document.getElementById('copySubj');
    btn.textContent = 'Gekopieerd ✓';
    btn.classList.add('done');
    setTimeout(() => { btn.textContent = 'Kopieer'; btn.classList.remove('done'); }, 2000);
  });
}

render();
</script>
</body>
</html>
