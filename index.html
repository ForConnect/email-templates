<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Email Templates — ForConnect</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #0a0e14;
  --surface: #111620;
  --surface2: #181e2a;
  --border2: #2a3347;
  --text: #e8edf5;
  --muted: #5a6580;
  --muted2: #8a96b0;
  --cyan: #00e5c8;
  --cyan-dim: rgba(0,229,200,0.12);
  --cyan-border: rgba(0,229,200,0.3);
  --sans: 'Inter', sans-serif;
}

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 2.5rem 1rem;
}

.container {
  max-width: 660px;
  margin: 0 auto;
}

/* HEADER */

header {
  margin-bottom: 2.5rem;
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 8px var(--cyan);
  flex-shrink: 0;
}

header h1 {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted2);
}

header h1 span {
  color: var(--cyan);
}

/* NAME FIELD */

.field {
  margin-bottom: 1.5rem;
}

.field label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.field input {
  width: 100%;
  padding: 11px 16px;
  font-family: var(--sans);
  font-size: 10px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  color: var(--text);
  outline: none;
}

.field input:focus {
  border-color: var(--cyan-border);
  box-shadow: 0 0 0 3px rgba(0,229,200,0.06);
}

.field input::placeholder {
  color: var(--muted);
}

/* TABS */

.tabs {
  display: flex;
  gap: 0;
  margin-bottom: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 4px;
}

.tab {
  flex: 1;
  padding: 9px 6px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 500;
  text-align: center;
  border: none;
  background: transparent;
  color: var(--muted2);
  border-radius: 7px;
  cursor: pointer;
  white-space: nowrap;
}

.tab.active {
  background: var(--cyan-dim);
  color: var(--cyan);
  border: 1px solid var(--cyan-border);
}

.tab:hover:not(.active) {
  color: var(--text);
  background: var(--surface2);
}

/* SUBJECT */

.subject-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
}

.subject-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  flex-shrink: 0;
}

.subject-text {
  font-size: 10px;
  color: var(--muted2);
  flex: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.copy-subj {
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 5px 12px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted2);
  border-radius: 6px;
  cursor: pointer;
  white-space: nowrap;
}

.copy-subj:hover {
  border-color: var(--cyan-border);
  color: var(--cyan);
}

.copy-subj.done {
  border-color: var(--cyan-border);
  color: var(--cyan);
  background: var(--cyan-dim);
}

/* EMAIL PREVIEW */

.preview {
  background: #ffffff;
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 24px;
  font-family: sans-serif;
  font-size: 13px;
  line-height: 1.45;
  color: #202124;
  min-height: 260px;
  margin-bottom: 1rem;
}

.preview strong {
  color: #202124;
  font-weight: 700;
}

/* COPY BUTTON */

.copy-body {
  width: 100%;
  padding: 13px;
  font-family: var(--sans);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  background: var(--cyan);
  color: #050a0e;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.copy-body:hover {
  background: #00ccb4;
}

.copy-body:active {
  transform: scale(0.99);
}

.copy-body.done {
  background: #00b89f;
}

/* FOOTER */

footer {
  margin-top: 2rem;
  text-align: center;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 0.05em;
}

</style>
</head>


<body>

<div class="container">

  <header>
    <div class="logo-dot"></div>

    <h1>
      AI Telefoonassistent &nbsp;·&nbsp;
      <span>Email Templates</span>
    </h1>
  </header>


  <!-- NAME -->

  <div class="field">

    <label>Naam / Praktijk</label>

    <input
      type="text"
      id="nameInput"
      placeholder="bijv. Laura"
      oninput="render()"
    >

  </div>


  <!-- TABS -->

  <div class="tabs">

    <button
      class="tab active"
      onclick="setTab(0)"
    >
      Eerste contact NL
    </button>

    <button
      class="tab"
      onclick="setTab(1)"
    >
      Eerste contact BE
    </button>

    <button
      class="tab"
      onclick="setTab(2)"
    >
      Follow-up NL
    </button>

    <button
      class="tab"
      onclick="setTab(3)"
    >
      Follow-up BE
    </button>

  </div>


  <!-- SUBJECT -->

  <div class="subject-row">

    <span class="subject-label">
      Subject
    </span>

    <span
      class="subject-text"
      id="subjText"
    ></span>

    <button
      class="copy-subj"
      id="copySubj"
      onclick="copySubj()"
    >
      Kopieer
    </button>

  </div>


  <!-- EMAIL -->

  <div
    class="preview"
    id="preview"
  ></div>


  <!-- COPY -->

  <button
    class="copy-body"
    id="copyBody"
    onclick="copyBody()"
  >
    Kopieer volledige e-mail
  </button>


  <footer>
    forconnect.nl &nbsp;·&nbsp; AI Telefoonassistent
  </footer>

</div>


<script>


/* =========================================================
   TEMPLATES
   ========================================================= */

const templates = [

  /* =======================================================
     1. EERSTE CONTACT NL
     ======================================================= */

  {
    subject: "Even een korte praktische vraag",

    body: n => `Beste ${n},

Op uw website zag ik dat patiënten u kunnen bereiken via de telefoon.

Maar wat gebeurt er met iemand die belt op het moment dat u in behandeling bent?

Die beller hangt op — en u weet niet wie het was, of wat de reden was.

Terugbellen betekent dat u daar later opnieuw tijd voor moet maken — terwijl de kans groot is dat u elkaar mist.

Wij ontwikkelden een <strong>persoonlijke telefonische assistent</strong> die precies op dat moment overneemt. Zij spreekt natuurlijk Nederlands, beantwoordt vragen en neemt ook verzoeken voor afspraken, wijzigingen of annuleringen aan. Naam, telefoonnummer en de reden van contact ontvangt u daarna overzichtelijk per e-mail.

Daarnaast kan zij ook direct informatie geven over uw praktijk — zoals locaties, openingstijden, behandelingen, tarieven en vergoedingen.

De investering per maand is <strong>vergelijkbaar met één behandeling</strong>.

Wilt u zelf horen hoe zij klinkt? <strong>Bel en voer gerust een gesprek met onze AI assistent: +31 26 79 132 73</strong> — geheel vrijblijvend.`
  },


  /* =======================================================
     2. EERSTE CONTACT BE
     ======================================================= */

  {
    subject: "Even een korte praktische vraag",

    body: n => `Beste ${n},

Op uw website zag ik dat patiënten u kunnen bereiken via de telefoon.

Maar <strong>wat gebeurt er met iemand die belt op het moment dat u in behandeling bent?<strong>

Die beller hangt op — en u weet niet wie het was, of wat de reden was.

Terugbellen betekent dat u daar later opnieuw tijd voor moet maken — terwijl de kans groot is dat u elkaar mist.

Wij ontwikkelden een <strong>persoonlijke telefonische assistent<strong> die precies op dat moment overneemt. Zij spreekt natuurlijk Nederlands, beantwoordt vragen en neemt ook verzoeken voor afspraken, wijzigingen of annuleringen aan. Naam, telefoonnummer en de reden van contact ontvangt u daarna overzichtelijk per e-mail.

Daarnaast kan zij ook direct informatie geven over uw kinesitherapiepraktijk — zoals locaties, openingstijden, behandelingen, tarieven en vergoedingen.

De investering per maand is <strong>vergelijkbaar met één behandeling</strong>.

Wilt u zelf horen hoe zij klinkt? <strong>Bel en voer gerust een gesprek met onze AI assistent: +32 78 70 04 02</strong> — geheel vrijblijvend.`
  },


  /* =======================================================
     3. FOLLOW-UP NL
     ======================================================= */

  {
    subject: "Re: Even een korte praktische vraag",

    body: n => `Beste ${n},

Ik stuurde u onlangs een e-mail over telefonische bereikbaarheid. Misschien is die ongemerkt voorbijgegaan — begrijpelijk, want u bent waarschijnlijk druk met behandelingen.

Daarom kort en concreet:

Wat gebeurt er met iemand die belt terwijl u met een patiënt bezig bent?

Die beller hangt op — en u weet niet wie het was, of wat de reden was.

Terugbellen betekent dat u daar later opnieuw tijd voor moet maken — terwijl de kans groot is dat u elkaar mist.

Daarnaast beantwoordt de <strong>persoonlijke telefonische assistent</strong> praktische vragen — openingstijden, tarieven, locatie, parkeren, verzekeringen — zonder dat u daar iets voor hoeft te doen.

<strong>Twee weken gratis uitproberen. Geen verplichtingen. Maandelijks opzegbaar.</strong>

Zelf even horen hoe het klinkt? <strong>Bel en voer gerust een gesprek met onze AI assistent: +31 26 79 132 73</strong>`
  },


  /* =======================================================
     4. FOLLOW-UP BE
     ======================================================= */

  {
    subject: "Re: Even een korte praktische vraag",

    body: n => `Beste ${n},

Ik stuurde u onlangs een e-mail over telefonische bereikbaarheid. Misschien is die ongemerkt voorbijgegaan — begrijpelijk, want u bent waarschijnlijk druk met behandelingen.

Daarom kort en concreet:

Wat gebeurt er met iemand die belt terwijl u met een patiënt bezig bent?

Die beller hangt op — en u weet niet wie het was, of wat de reden was.

Terugbellen betekent dat u daar later opnieuw tijd voor moet maken — terwijl de kans groot is dat u elkaar mist.

Daarnaast beantwoordt de <strong>persoonlijke telefonische assistent</strong> praktische vragen — openingstijden, tarieven, locatie, parkeren, verzekeringen — zonder dat u daar iets voor hoeft te doen.

<strong>Twee weken gratis uitproberen. Geen verplichtingen. Maandelijks opzegbaar.</strong>

Zelf even horen hoe het klinkt? <strong>Bel en voer gerust een gesprek met onze AI assistent: +32 78 70 04 02</strong>`
  }

];


let current = 0;


/* =========================================================
   NAME
   ========================================================= */

function getName() {

  const value =
    document
      .getElementById('nameInput')
      .value
      .trim();

  return value || '[Naam]';

}


/* =========================================================
   TAB
   ========================================================= */

function setTab(index) {

  current = index;

  document
    .querySelectorAll('.tab')
    .forEach((tab, i) => {

      tab.classList.toggle(
        'active',
        i === index
      );

    });

  render();

}


/* =========================================================
   EMAIL → HTML
   =========================================================

   Namerno koristimo samo <br><br>.
   To je najstabilnije za Gmail copy/paste.
*/

function emailToHtml(text) {

  return text
    .split(/\n\s*\n/)
    .map(paragraph => {

      return paragraph.replace(
        /\n/g,
        '<br>'
      );

    })
    .join('<br><br>');

}


/* =========================================================
   HTML → PLAIN TEXT
   ========================================================= */

function htmlToPlainText(html) {

  return html
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/?strong>/gi, '')
    .replace(/<\/?b>/gi, '');

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

  const template =
    templates[current];

  const email =
    template.body(getName());


  /* Subject */

  document
    .getElementById('subjText')
    .textContent =
      template.subject;


  /* Preview */

  document
    .getElementById('preview')
    .innerHTML =
      emailToHtml(email);


  /* Reset buttons */

  const bodyButton =
    document.getElementById('copyBody');

  bodyButton.textContent =
    'Kopieer volledige e-mail';

  bodyButton.classList.remove('done');


  const subjectButton =
    document.getElementById('copySubj');

  subjectButton.textContent =
    'Kopieer';

  subjectButton.classList.remove('done');

}


/* =========================================================
   COPY EMAIL
   ========================================================= */

function copyBody() {

  const template =
    templates[current];

  const rawText =
    template.body(getName());


  /*
    Isti HTML koji vidiš u preview-u
    koristi se i za Gmail.
  */

  const htmlBody = `
    <div style="
      font-family:sans-serif;
      font-size:13px;
      line-height:1.45;
      color:#202124;
    ">
      ${emailToHtml(rawText)}
    </div>
  `;


  const plainText =
    htmlToPlainText(rawText);


  const button =
    document.getElementById('copyBody');


  function success() {

    button.textContent =
      'Gekopieerd ✓';

    button.classList.add('done');


    setTimeout(() => {

      button.textContent =
        'Kopieer volledige e-mail';

      button.classList.remove('done');

    }, 2000);

  }


  function failure() {

    button.textContent =
      'Kopiëren mislukt';


    setTimeout(() => {

      button.textContent =
        'Kopieer volledige e-mail';

    }, 2000);

  }


  try {

    const htmlBlob =
      new Blob(
        [htmlBody],
        {
          type: 'text/html'
        }
      );


    const textBlob =
      new Blob(
        [plainText],
        {
          type: 'text/plain'
        }
      );


    navigator.clipboard
      .write([
        new ClipboardItem({
          'text/html': htmlBlob,
          'text/plain': textBlob
        })
      ])
      .then(success)
      .catch(() => {

        navigator.clipboard
          .writeText(plainText)
          .then(success)
          .catch(failure);

      });


  } catch (error) {

    navigator.clipboard
      .writeText(plainText)
      .then(success)
      .catch(failure);

  }

}


/* =========================================================
   COPY SUBJECT
   ========================================================= */

function copySubj() {

  const subject =
    templates[current].subject;


  navigator.clipboard
    .writeText(subject)
    .then(() => {

      const button =
        document.getElementById('copySubj');


      button.textContent =
        'Gekopieerd ✓';

      button.classList.add('done');


      setTimeout(() => {

        button.textContent =
          'Kopieer';

        button.classList.remove('done');

      }, 2000);

    });

}


/* =========================================================
   INITIAL RENDER
   ========================================================= */

render();

</script>

</body>
</html>
